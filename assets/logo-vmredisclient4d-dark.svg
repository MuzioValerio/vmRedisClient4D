<svg xmlns="http://www.w3.org/2000/svg" width="840" height="260" viewBox="0 0 840 260" role="img" aria-labelledby="title">
  <title id="title">vmRedisClient4D — Native Redis client for Delphi</title>

  <!-- Icona: tre righe chiave → valore che convergono in una sola connessione (il client) -->
  <g transform="translate(30 30)">
    <rect x="0" y="0" width="200" height="200" rx="40" fill="#2D333B"/>

    <!-- righe chiave/valore -->
    <g>
      <rect x="28" y="44" width="26" height="26" rx="6" fill="#F0485C"/>
      <rect x="64" y="51" width="58" height="12" rx="6" fill="#E6EDF3"/>

      <rect x="28" y="87" width="26" height="26" rx="6" fill="#F0485C"/>
      <rect x="64" y="94" width="40" height="12" rx="6" fill="#E6EDF3"/>

      <rect x="28" y="130" width="26" height="26" rx="6" fill="#F0485C"/>
      <rect x="64" y="137" width="50" height="12" rx="6" fill="#E6EDF3"/>
    </g>

    <!-- linee che convergono nel nodo del client -->
    <g fill="none" stroke="#8B949E" stroke-width="5" stroke-linecap="round">
      <path d="M130 57 C 148 57, 148 100, 160 100"/>
      <path d="M112 100 L 160 100"/>
      <path d="M122 143 C 148 143, 148 100, 160 100"/>
    </g>
    <circle cx="166" cy="100" r="13" fill="#F0485C"/>
    <circle cx="166" cy="100" r="5" fill="#2D333B"/>
  </g>

  <!-- Nome -->
  <text x="262" y="138" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="700" letter-spacing="-1">
    <tspan fill="#F0485C">vm</tspan><tspan fill="#E6EDF3">RedisClient</tspan><tspan fill="#F0485C">4D</tspan>
  </text>

  <!-- Sottotitolo -->
  <rect x="266" y="165" width="44" height="4" rx="2" fill="#F0485C"/>
  <text x="324" y="174" font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="26" fill="#9DA7B3" letter-spacing="1">Native Redis client for Delphi</text>
</svg>
